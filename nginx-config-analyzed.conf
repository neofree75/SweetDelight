# ANALÝZA A OPRAVENÁ NGINX KONFIGURÁCIA
# ============================================
#
# NALEZENÉ PROBLÉMY:
# ------------------
# 1. ✅ location /api - OK, ale lepšie použiť /api/ s redirectom
# 2. ❌ proxy_pass bez trailing slash - môže spôsobovať problémy s path handling
# 3. ❌ Chýbajú Content-Type headers pre JSON responses
# 4. ❌ Chýba redirect pre /api -> /api/
# 5. ✅ SSL konfigurácia - OK
# 6. ✅ Assets handling - OK
# 7. ✅ SPA fallback - OK, ale musí byť posledný
#
# SERVER OČAKÁVA: /api/test, /api/health, atď. (s /api/ prefixom)
# ============================================

server {
    listen 80;
    server_name bakery.erpnext.sk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bakery.erpnext.sk;

    ssl_certificate     /etc/letsencrypt/live/bakery.erpnext.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bakery.erpnext.sk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "same-origin";

    root /var/www/SweetDelight/dist/public;
    index index.html;

    # KRITICKÉ: API backend MUSÍ byť PRED location /
    # Redirect /api -> /api/ pre konzistentnosť
    location = /api {
        return 301 /api/;
    }

    # API proxy - používame /api/ s trailing slash pre správne matching
    location /api/ {
        # Dôležité: proxy_pass MUSÍ mať trailing slash, aby sa zachoval /api/ prefix
        # Request /api/test -> http://127.0.0.1:5001/api/test ✅
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # JSON Content-Type handling
        proxy_set_header Accept application/json;
        proxy_hide_header Content-Type;
        add_header Content-Type application/json always;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Správne servovanie assetov
    location /assets {
        alias /var/www/SweetDelight/dist/public/assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React routes (SPA fallback) - MUSÍ byť POSLEDNÝ
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ALTERNATÍVA: Ak chceš používať /api bez trailing slash
# --------------------------------------------------------
# location /api {
#     proxy_pass http://127.0.0.1:5001;
#     # ... ostatné nastavenia
# }
# 
# Toto funguje, pretože:
# Request /api/test -> http://127.0.0.1:5001/api/test ✅
# Ale /api/ test -> http://127.0.0.1:5001/api/test ✅ (funguje oboje)
# 
# Avšak doporučujeme použiť /api/ s trailing slash pre konzistentnosť

