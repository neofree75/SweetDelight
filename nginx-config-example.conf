# Nginx konfigurácia pre SweetDelight
# Umiestnenie: /etc/nginx/sites-available/sweet-delight
# 
# DÔLEŽITÉ: location /api/ MUSÍ byť pred location /
# Inak sa API requests nepreposielajú správne na Node.js server

server {
    listen 80;
    listen [::]:80;
    server_name bakery.erpnext.sk;

    # DÔLEŽITÉ: API routes MUSIA byť PRED root location
    # Toto zabezpečí, že /api/* requests idú na Node.js server
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Dôležité pre JSON responses
        proxy_set_header Accept application/json;
        proxy_hide_header Content-Type;
        add_header Content-Type application/json;
    }

    # Všetko ostatné (SPA routing) - musí byť PO /api/
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

