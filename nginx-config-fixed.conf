server {
    listen 80;
    server_name bakery.erpnext.sk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bakery.erpnext.sk;

    ssl_certificate     /etc/letsencrypt/live/bakery.erpnext.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bakery.erpnext.sk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "same-origin";

    root /var/www/SweetDelight/dist/public;
    index index.html;

    # KRITICKÉ: API backend MUSÍ byť PRED location /
    # Používame /api/ s trailing slash pre správne matching
    location /api/ {
        # Dôležité: proxy_pass MUSÍ mať trailing slash alebo full path
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Explicitne nastav JSON content type pre API
        proxy_set_header Accept application/json;
        proxy_hide_header Content-Type;
        add_header Content-Type application/json always;
    }

    # Alternatíva: Ak chceš matchovať aj /api bez trailing slash
    location = /api {
        return 301 /api/;
    }

    # Správne servovanie assetov
    location /assets {
        alias /var/www/SweetDelight/dist/public/assets;
    }

    # React routes (SPA fallback) - MUSÍ byť POSLEDNÝ
    location / {
        try_files $uri /index.html;
    }
}

